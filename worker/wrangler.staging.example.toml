name = "gradstudio-app-staging"
main = "src/index.js"
compatibility_date = "2024-01-20"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true
routes = []

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[assets]
directory = "../static"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"

[[d1_databases]]
binding = "DB"
database_name = "gradstudio-app-staging"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_STAGING_KV_ID"

[[kv_namespaces]]
binding = "REFRESH_TOKENS"
id = "REPLACE_WITH_STAGING_REFRESH_TOKENS_KV_ID"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "REPLACE_WITH_STAGING_RATE_LIMITS_KV_ID"

[[services]]
binding = "CONTENT"
service = "gradstudio-content-staging"

[vars]
ENVIRONMENT = "staging"
GOOGLE_OAUTH_CLIENT_ID = "776987891418-hcga1uorb5v5hqhm06qfdgi10556jaok.apps.googleusercontent.com"
ENVIRONMENT_ISOLATED = "true"
GIT_CONTENT_ENABLED = "true"
APP_SOURCE_COMMIT = "REPLACE_WITH_APP_SOURCE_COMMIT"
JWT_ISSUER = "gradstudio-staging"
JWT_AUDIENCE = "gradstudio-api-staging"
ALLOWED_ORIGINS = "REPLACE_WITH_STAGING_APP_URL"
CONTENT_PUBLIC_ORIGIN = "REPLACE_WITH_STAGING_CONTENT_URL"
MAX_CACHE_TTL = "300"
ENABLE_BOT_PROTECTION = "true"
