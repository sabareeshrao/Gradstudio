name: Temporary player header and live catalog review
on:
  push:
    branches: [chatgpt/restore-player-header-layout]
    paths: ['.github/workflows/temporary-player-header-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Verify both GPU lessons in the live application catalog
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {loadApplicationCatalog, applicationModelToUiCatalog} from './static/modules/content-catalog-v1.mjs';
          const origin='https://gradstudio-app-staging.gradstudio-non-production.workers.dev';
          const model=await loadApplicationCatalog(origin);
          assert.equal(model.state,'ready');
          const ui=applicationModelToUiCatalog(model);
          const course=ui.courses.find(c=>c.id==='course-machine-learning');
          assert.ok(course);
          console.log(JSON.stringify({release:model.release,course:course.title,lessons:course.lessons.map((x,index)=>({id:x.id,title:x.title,url:origin+'/#course/'+course.id+'/lesson/'+index,src:x.src}))}));
          for(const id of ['sim-gpu-detailed','sim-gpu-interactive']){
            const item=course.lessons.find(x=>x.id===id);
            assert.ok(item,id);
            const res=await fetch(item.src,{cache:'no-store',signal:AbortSignal.timeout(10000)});
            assert.equal(res.status,200);
            assert.match(await res.text(),/<title[^>]*>[^<]*GPU/i);
          }
          JS
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Test original header layout and refresh only player visual evidence
        run: npx playwright test tests/ui/browser/ui-smoke.spec.mjs tests/ui/browser/lesson-zoom.spec.mjs --grep 'course player visual baseline|lesson zoom changes' --update-snapshots=all
      - name: Export only synthetic player snapshots
        shell: bash
        run: |
          set -euo pipefail
          for viewport in desktop-chrome tablet-chrome mobile-chrome; do
            file="tests/ui/browser/__screenshots__/linux/$viewport/course-player.png"
            echo "IMAGE_INFO:$viewport:$(git hash-object "$file"):$(wc -c < "$file")"
            base64 -w 4000 "$file" | sed "s/^/SNAPSHOT_CHUNK:$viewport:/"
          done
