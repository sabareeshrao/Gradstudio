name: Temporary lesson zoom screenshot transfer
on:
  push:
    branches: [chatgpt/lesson-content-zoom]
    paths: ['.github/workflows/temporary-lesson-zoom-snapshot-transfer.yml']
permissions:
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        viewport: [desktop-chrome, tablet-chrome, mobile-chrome]
    env:
      GH_TOKEN: ${{ github.token }}
      VIEWPORT: ${{ matrix.viewport }}
    steps:
      - name: Retrieve only the player screenshot from the failed PR run
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/sabareeshrao/Gradstudio/actions/runs/45725081455 --jq .head_sha)" = "b6c5fd9a1354bf9d86c642cd9cab3132b62d2569"
          gh run download 45725081455 --repo sabareeshrao/Gradstudio --name ui-browser-diagnostics-45725081455 --dir "$RUNNER_TEMP/zoom-evidence"
          file="$RUNNER_TEMP/zoom-evidence/ui-browser/ui-smoke-course-player-visual-baseline-$VIEWPORT/course-player-actual.png"
          test -f "$file"
          echo "IMAGE_INFO:$(git hash-object "$file"):$(wc -c < "$file")"
          base64 -w 4000 "$file" | sed 's/^/SNAPSHOT_CHUNK:/'
