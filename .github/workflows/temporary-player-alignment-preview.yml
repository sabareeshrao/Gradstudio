name: Temporary player alignment preview
# Re-run with layout-settling assertion
on:
  push:
    branches: [chatgpt/group-player-toolbar-chips]
    paths: ['.github/workflows/temporary-player-alignment-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Generate only the intentionally changed player baselines and test alignment
        run: npx playwright test tests/ui/browser/ui-smoke.spec.mjs tests/ui/browser/lesson-zoom.spec.mjs --grep 'course player visual baseline|lesson zoom changes' --update-snapshots
      - name: Export only the three synthetic player previews
        shell: bash
        run: |
          set -euo pipefail
          for viewport in desktop-chrome tablet-chrome mobile-chrome; do
            file="tests/ui/browser/__screenshots__/linux/$viewport/course-player.png"
            echo "IMAGE_INFO:$viewport:$(git hash-object "$file"):$(wc -c < "$file")"
            base64 -w 4000 "$file" | sed "s/^/SNAPSHOT_CHUNK:$viewport:/"
          done
