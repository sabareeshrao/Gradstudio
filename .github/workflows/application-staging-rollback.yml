name: Application staging rollback

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Exact Cloudflare Worker version ID to restore
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gradstudio-application-staging
  cancel-in-progress: false

jobs:
  staging-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        name: Read protected staging gate without credentials
        env:
          STAGING_ENABLED: ${{ vars.CLOUDFLARE_STAGING_ENABLED }}
        run: |
          if [ "$STAGING_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Application staging rollback is disabled."
          fi

  rollback-staging:
    needs: staging-gate
    if: needs.staging-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_STAGING_ORIGIN: ${{ vars.APPLICATION_STAGING_ORIGIN }}
      TARGET_VERSION_ID: ${{ inputs.version_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Validate requested version identifier
        run: node -e "if(!/^[0-9a-f-]{16,64}$/i.test(process.env.TARGET_VERSION_ID))throw new Error('Malformed Cloudflare Worker version ID')"
      - name: Install locked Worker deployment tooling
        working-directory: worker
        run: npm ci
      - name: Roll back only the isolated application staging Worker
        working-directory: worker
        run: npx wrangler rollback "$TARGET_VERSION_ID" --name gradstudio-app-staging --message "GitHub staging rollback ${GITHUB_RUN_ID}"
      - name: Verify restored staging deployment
        run: |
          node -e "const origin=new URL(process.env.APPLICATION_STAGING_ORIGIN);for(let attempt=0;attempt<12;attempt++){try{const health=await fetch(origin+'/api/health',{headers:{Accept:'application/json'}});const body=await health.json();if(health.ok&&body.environment==='staging'&&body.content_source==='git'){const root=await fetch(origin+'/');if(root.ok)process.exit(0)}}catch(error){if(attempt===11)throw error}await new Promise(resolve=>setTimeout(resolve,5000))}throw new Error('Rolled-back staging Worker did not become healthy');"

